<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Aplikasi Web Nota Digital — Bank Sampah Saling</title>
  <link rel="icon" type="image/png" href="assets/logo.png">

  <!-- Font Awesome 6.5.2 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Application CSS Modules -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/form.css">
  <link rel="stylesheet" href="css/nota.css">
  <link rel="stylesheet" href="css/print.css">

  <!-- html2canvas 1.4.1 CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <div class="app-container">
      <!-- Header App -->
      <header class="app-header">
        <div class="brand-section">
          <img src="assets/logo.png" alt="Logo Bank Sampah Saling" class="brand-logo-header" width="32" height="32">
          <h1 class="brand-title">Nota Digital</h1>
        </div>
        <div class="header-actions">
          <button type="button" class="btn btn-outline-primary" id="btn-new-note" title="Buat nota baru">
            <i class="fa-solid fa-plus" aria-hidden="true"></i>
            <span class="btn-text">Nota Baru</span>
          </button>
          <button type="button" class="btn btn-outline-danger" id="btn-reset" title="Kosongkan formulir">
            <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
            <span class="btn-text">Reset</span>
          </button>
          <button type="button" class="btn btn-secondary" id="btn-print" title="Cetak nota">
            <i class="fa-solid fa-print" aria-hidden="true"></i>
            <span class="btn-text">Cetak</span>
          </button>
          <button type="button" class="btn btn-primary" id="btn-download" title="Unduh nota sebagai PNG">
            <i class="fa-solid fa-download" aria-hidden="true"></i>
            <span class="btn-text">Unduh PNG</span>
          </button>
        </div>
      </header>

      <!-- Main Content -->
      <main class="main-content" data-view="edit">
        <!-- Tab tampilan (mobile & tablet) -->
        <div class="view-tabs">
          <div class="view-tabs-track" role="group" aria-label="Tampilan">
            <button type="button" class="view-tab active" data-view="edit" aria-pressed="true">
              <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i> Isi nota
            </button>
            <button type="button" class="view-tab" data-view="preview" aria-pressed="false">
              <i class="fa-solid fa-eye" aria-hidden="true"></i> Pratinjau
            </button>
          </div>
        </div>

        <!-- Editor Panel -->
        <section class="panel panel-editor" aria-label="Formulir nota">
          <div class="form-row-2">
            <div class="form-group">
              <label class="form-label" for="input-nota-seq">No. nota</label>
              <div class="nota-number-group">
                <span class="nota-prefix" id="label-nota-prefix">BSS/2026/</span>
                <input type="number" id="input-nota-seq" class="form-input input-seq" min="1" inputmode="numeric" placeholder="001">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="input-date">Tanggal</label>
              <input type="date" id="input-date" class="form-input">
            </div>
          </div>

          <div class="form-group">
            <span class="form-label" id="label-type">Jenis transaksi</span>
            <div class="segmented-control" role="group" aria-labelledby="label-type">
              <button type="button" class="segmented-option active" data-type="pemasukan" aria-pressed="true">
                <i class="fa-solid fa-circle-arrow-down" aria-hidden="true"></i> Pemasukan
              </button>
              <button type="button" class="segmented-option" data-type="pengeluaran" aria-pressed="false">
                <i class="fa-solid fa-circle-arrow-up" aria-hidden="true"></i> Pengeluaran
              </button>
            </div>
          </div>

          <div class="editor-section-header">
            <h2 class="section-title">Daftar item</h2>
          </div>

          <div class="items-list" id="items-editor-list">
            <!-- Item rows generated dynamically by JS -->
          </div>

          <button type="button" class="btn btn-add-item" id="btn-add-item">
            <i class="fa-solid fa-plus" aria-hidden="true"></i> Tambah item
          </button>

          <div class="form-group">
            <label class="form-label" for="input-notes">Catatan</label>
            <textarea id="input-notes" class="form-textarea" placeholder="Tambahkan catatan jika ada"></textarea>
          </div>

          <div class="form-group">
            <span class="form-label" id="label-sig">Tanda tangan pada nota</span>
            <div class="signature-toggles" role="group" aria-labelledby="label-sig">
              <label class="checkbox-label">
                <input type="checkbox" id="chk-sig-sekretaris">
                Sekretaris
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="chk-sig-bendahara">
                Bendahara
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="chk-sig-ketua">
                Ketua Bank Sampah
              </label>
            </div>
          </div>
        </section>

        <!-- Preview Panel -->
        <section class="panel panel-preview" aria-label="Pratinjau nota">
          <div class="preview-title-bar">
            <span class="preview-label">Pratinjau nota</span>
            <span class="preview-hint">Sama dengan hasil cetak dan unduhan</span>
          </div>
          <div id="preview-container" class="preview-container-wrapper nota-stage">
            <!-- Nota rendered dynamic by render.js -->
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Entry Point Script ES Module -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
