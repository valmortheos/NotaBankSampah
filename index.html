<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Web Nota Digital — Bank Sampah Saling</title>
  <link rel="icon" type="image/png" href="assets/logo.png">

  <!-- Font Awesome 6.5.2 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Application CSS Modules -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/form.css">
  <link rel="stylesheet" href="css/nota.css">
  <link rel="stylesheet" href="css/print.css">

  <!-- html2canvas 1.4.1 CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <div class="app-container">
      <!-- Header App -->
      <header class="app-header">
        <div class="brand-section">
          <img src="assets/logo.png" alt="Logo Bank Sampah Saling" class="brand-logo-header">
          <h1 class="brand-title">Nota Digital</h1>
        </div>
        <div class="header-actions">
          <button type="button" class="btn btn-outline-primary" id="btn-new-note" title="Buat Nota Baru">
            <i class="fa-solid fa-plus"></i>
            <span class="btn-text">Nota Baru</span>
          </button>
          <button type="button" class="btn btn-outline-danger" id="btn-reset" title="Reset Form">
            <i class="fa-solid fa-rotate-left"></i>
            <span class="btn-text">Reset</span>
          </button>
          <button type="button" class="btn btn-secondary" id="btn-print" title="Cetak Nota">
            <i class="fa-solid fa-print"></i>
            <span class="btn-text">Cetak</span>
          </button>
          <button type="button" class="btn btn-primary" id="btn-download" title="Unduh PNG">
            <i class="fa-solid fa-download"></i>
            <span class="btn-text">Unduh PNG</span>
          </button>
        </div>
      </header>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Editor Panel (Kiri Desktop, Atas Mobile) -->
        <section class="panel panel-editor">
          <div class="form-row-2">
            <div class="form-group">
              <label class="form-label" for="input-nota-seq">No. Nota</label>
              <div class="nota-number-group">
                <span class="nota-prefix" id="label-nota-prefix">BSS/2026/</span>
                <input type="number" id="input-nota-seq" class="form-input input-seq" min="1" placeholder="001">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="input-date">Tanggal</label>
              <input type="date" id="input-date" class="form-input">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Jenis Transaksi</label>
            <div class="segmented-control">
              <div class="segmented-option active" data-type="pemasukan">
                <i class="fa-solid fa-arrow-down-left"></i> Pemasukan
              </div>
              <div class="segmented-option" data-type="pengeluaran">
                <i class="fa-solid fa-arrow-up-right"></i> Pengeluaran
              </div>
            </div>
          </div>

          <div class="editor-section-header">
            <span class="section-title">Daftar Item</span>
            <button type="button" class="btn btn-secondary btn-add-item" id="btn-add-item">
              <i class="fa-solid fa-plus"></i> Tambah Item
            </button>
          </div>

          <div class="items-list" id="items-editor-list">
            <!-- Item rows generated dynamically by JS -->
          </div>

          <div class="form-group">
            <label class="form-label" for="input-notes">Catatan</label>
            <textarea id="input-notes" class="form-textarea" placeholder="Tambahkan catatan jika ada..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Tanda Tangan Terlampir</label>
            <div class="signature-toggles">
              <label class="checkbox-label">
                <input type="checkbox" id="chk-sig-sekretaris">
                Tampilkan TDT Sekretaris
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="chk-sig-bendahara">
                Tampilkan TDT Bendahara
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="chk-sig-ketua">
                Tampilkan TDT Ketua
              </label>
            </div>
          </div>
        </section>

        <!-- Preview Panel (Kanan Desktop, Bawah Mobile) -->
        <section class="panel panel-preview">
          <div class="preview-title-bar">
            <span class="preview-label">Live Preview Nota</span>
          </div>
          <div id="preview-container" class="preview-container-wrapper">
            <!-- Nota rendered dynamic by render.js -->
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Entry Point Script ES Module -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
